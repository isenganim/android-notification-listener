name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.1.0), dipakai saat manual run"
        required: false
        default: "1.0"
      versionCode:
        description: "Build number (monotonic), opsional saat manual run"
        required: false
        default: ""

jobs:
  release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum di-set. Baca README (butuh 4 secret Actions)."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore-release.jks
          test -s keystore-release.jks

      - name: Resolve release version
        id: ver
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME#v}"          # strip leading 'v'  (v1.2.3 -> 1.2.3)
          else
            # manual/workflow_dispatch -> pakai input version
            TAG="${{ github.event.inputs.version }}"
            [[ -n "${TAG}" ]] || TAG="1.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG}"
          : "${MAJOR:=0}"; : "${MINOR:=0}"; : "${PATCH:=0}"
          PATCH="${PATCH%%[-+]*}"                # buang -rc1 / +meta

          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          MANUAL_CODE="${{ github.event.inputs.versionCode }}"
          if [[ -n "${MANUAL_CODE}" ]]; then
            VERSION_CODE="${MANUAL_CODE}"
          fi

          echo "name=${TAG}"    >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload artifact (debug cadangan)
        uses: actions/upload-artifact@v7
        with:
          name: qris-listener-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
